{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "cargo",
      "directory": "/",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 1,
      "groups": {
        "dependencies": {
          "patterns": [
            "*"
          ]
        }
      }
    },
    {
      "package-ecosystem": "npm",
      "directory": "/vscode",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 1,
      "groups": {
        "dependencies": {
          "patterns": [
            "*"
          ]
        }
      }
    },
    {
      "package-ecosystem": "maven",
      "directory": "/java",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 1,
      "groups": {
        "dependencies": {
          "patterns": [
            "*"
          ]
        }
      }
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 1,
      "groups": {
        "dependencies": {
          "patterns": [
            "*"
          ]
        }
      }
    }
  ]
}
