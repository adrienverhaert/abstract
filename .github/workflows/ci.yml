name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repository-hygiene:
    name: Repository privacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-repository-hygiene.py --self-test
      - run: python3 scripts/check-repository-hygiene.py

  rust-lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/check-release-manifest.py
      - run: cargo package --locked

  compiler:
    name: Compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep pull requests to one runner per primary OS. macOS uses the
        # native Apple-silicon label; release.yml also builds Intel macOS and
        # Linux arm64 assets on their matching hosted runners.
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: cargo build --release --locked --bin abstract

  rust-msrv:
    name: Rust MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.85
      - run: cargo test --locked


  vscode-unit:
    name: VS Code extension unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: cargo build --locked --bin abstract
        working-directory: .
      - run: npm test

  vscode-integration:
    name: VS Code ${{ matrix.vscode-version }} extension host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ['1.92.0', stable]
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: cargo build --locked --bin abstract
        working-directory: .
      - name: Run against the actual VS Code extension host
        env:
          ABSTRACT_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run --auto-servernum npm run test:integration
      - name: Check out the retained real compiler baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: compat-compiler-1.1.0
          path: .compat/compiler-1.1
          persist-credentials: false
      - name: Build the prior compiler for capability negotiation
        run: cargo build --locked --manifest-path .compat/compiler-1.1/Cargo.toml --target-dir .compat/compiler-1.1/target
        working-directory: .
      - name: Check public inventory against the actual extension host
        env:
          ABSTRACT_PUBLIC_OLD_COMPILER: ${{ github.workspace }}/.compat/compiler-1.1/target/debug/abstract
          ABSTRACT_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run --auto-servernum npm run test:integration:public

  vscode-package:
    name: Package VS Code extension
    needs: [vscode-unit, vscode-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: abstract-language-vsix
          path: vscode/*.vsix
          if-no-files-found: error
          retention-days: 7

  java-runtime:
    name: Java runtime (${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: cargo build --locked --bin abstract
      - run: mvn --batch-mode --file java/pom.xml verify
        env:
          ABSTRACT_COMPILER_PATH: ${{ github.workspace }}/target/debug/abstract


  quality-gate:
    name: Quality gate
    if: always()
    needs: [repository-hygiene, rust-lint, compiler, rust-msrv, java-runtime, vscode-unit, vscode-integration, vscode-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every component check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
