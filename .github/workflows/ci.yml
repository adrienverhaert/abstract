name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-hygiene:
    name: Repository privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-repository-hygiene.py --self-test
      - run: python3 scripts/check-repository-hygiene.py
